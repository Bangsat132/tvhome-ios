name: Build

# One workflow, two jobs: the launcher's unit tests, and a release APK published as a build artifact so the
# owner can sideload it without a JDK or an Android SDK. Run it from the repo's Actions tab (Run workflow) or:
#
#   gh workflow run Build
#   gh run watch
#   gh run download <run id> -n tvhome-ios-apk -D out
#
# The APK is a workflow artifact, never a release: nothing prebuilt lives in the tree.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Plain JVM tests
        working-directory: app
        run: |
          chmod +x ../gradlew
          ../gradlew --no-daemon testReleaseUnitTest

  apk:
    name: Release APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Assemble
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Report the APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -l "$apk"
          sha256sum "$apk" | tee /tmp/sha256.txt
          echo "### $(basename "$apk")" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/sha256.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-ios-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
